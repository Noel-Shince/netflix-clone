# Runs on every pull request and push to main so `main` stays always-working.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run build

  # Playwright smoke suite (docs/slices/20-e2e-tests.md): sign-in, browse,
  # open a title, sign out — against a real build and the real Firebase/TMDB
  # projects, using a dedicated test account.
  #
  # Needs two more repository secrets beyond deploy.yml's VITE_*/FIREBASE_*
  # ones: TEST_USER_EMAIL / TEST_USER_PASSWORD, for an email/password account
  # created ahead of time in the Firebase project's Authentication tab.
  # Until both are set this job is skipped, not failed — same as deploy.yml
  # does for FIREBASE_SERVICE_ACCOUNT — but that also means Deploy (which
  # waits on this workflow, see deploy.yml) isn't actually gated by E2E
  # results until they're added.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      HAS_TEST_ACCOUNT: ${{ secrets.TEST_USER_EMAIL != '' && secrets.TEST_USER_PASSWORD != '' }}
    steps:
      - name: Skip if the E2E test account is not set up yet
        if: env.HAS_TEST_ACCOUNT != 'true'
        run: echo "::warning::TEST_USER_EMAIL/TEST_USER_PASSWORD not set; skipping E2E tests."
      - uses: actions/checkout@v4
        if: env.HAS_TEST_ACCOUNT == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TEST_ACCOUNT == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.HAS_TEST_ACCOUNT == 'true'
        run: npm ci
      - if: env.HAS_TEST_ACCOUNT == 'true'
        run: npx playwright install --with-deps chromium
      - name: Build
        if: env.HAS_TEST_ACCOUNT == 'true'
        run: npm run build
        env:
          VITE_TMDB_READ_TOKEN: ${{ secrets.VITE_TMDB_READ_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Run Playwright
        if: env.HAS_TEST_ACCOUNT == 'true'
        run: npm run test:e2e
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - name: Upload Playwright report
        if: env.HAS_TEST_ACCOUNT == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
