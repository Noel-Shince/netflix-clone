# Deploys main to Firebase Hosting (live channel), gated on CI (lint, type
# check, build, Playwright E2E — see ci.yml) passing for that same commit, so
# the live demo never ships a broken build or a regression E2E would have
# caught. See docs/slices/08-deploy.md and docs/slices/20-e2e-tests.md.
#
# Runs as a follow-up to the CI workflow (`workflow_run`) instead of on push
# directly, so a push to main only reaches this job once CI has finished and
# reports its real pass/fail for that commit.
#
# Needs repository secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT  JSON key of a service account with the
#                             "Firebase Hosting Admin" role
#   VITE_TMDB_READ_TOKEN, VITE_FIREBASE_*  same values as .env.local
# Until FIREBASE_SERVICE_ACCOUNT exists the job is skipped, not failed.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: read code, and let the Firebase action
# post its deploy check. The deploy itself uses FIREBASE_SERVICE_ACCOUNT.
permissions:
  contents: read
  checks: write

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch is a manual, explicit deploy; a workflow_run trigger
    # only reaches here when CI finished successfully on main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      HAS_DEPLOY_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip if deploy secrets are not set up yet
        if: env.HAS_DEPLOY_KEY != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_DEPLOY_KEY == 'true'
        with:
          # Deploy the exact commit CI just checked, not whatever main is by
          # the time this runs (workflow_run otherwise checks out main's tip).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: env.HAS_DEPLOY_KEY == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.HAS_DEPLOY_KEY == 'true'
        run: npm ci
      - name: Build
        if: env.HAS_DEPLOY_KEY == 'true'
        run: npm run build
        env:
          VITE_TMDB_READ_TOKEN: ${{ secrets.VITE_TMDB_READ_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Deploy to Firebase Hosting
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: netflix-clone-b32df
      - name: Deploy Firestore rules
        # firestore.rules (slice 11) is only a file in the repo until this runs: Firebase does
        # not read it from a GitHub push on its own. Needs the service account to also hold
        # "Cloud Datastore Index Admin" or "Firebase Rules Admin" — Hosting Admin alone is not
        # enough and this step fails loudly rather than silently leaving stale rules live.
        if: env.HAS_DEPLOY_KEY == 'true'
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-deploy-key.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-deploy-key.json" \
            npx firebase-tools@14 deploy --only firestore:rules --project netflix-clone-b32df
          rm -f "$RUNNER_TEMP/firebase-deploy-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
